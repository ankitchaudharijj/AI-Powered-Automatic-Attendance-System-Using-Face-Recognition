{% extends "base.html" %}
{% block title %}{{ 'Edit Student' if student else 'Register Student' }}{% endblock %}

{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 700px;">
    <div class="card-header">
        <i class="bi bi-person-plus-fill"></i> {{ 'Edit Student' if student else 'Register New Student' }}
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Roll Number *</label>
                    <input type="text" name="roll_number" class="form-control" value="{{ student.roll_number if student else '' }}" {{ 'readonly' if student else '' }} required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Full Name *</label>
                    <input type="text" name="name" class="form-control" value="{{ student.name if student else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ student.email if student else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-control" value="{{ student.phone if student else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-select">
                        <option value="">Select</option>
                        {% for g in ['Male', 'Female', 'Other'] %}
                        <option value="{{ g }}" {{ 'selected' if student and student.gender == g }}>{{ g }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Class</label>
                    <select name="class_id" class="form-select">
                        <option value="">Unassigned</option>
                        {% for c in classes %}
                        <option value="{{ c.id }}" {{ 'selected' if student and student.class_id == c.id }}>{{ c.name }} {{ c.section or '' }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% if student %}
                <div class="col-12">
                    <div class="form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" id="isActive" {{ 'checked' if student.is_active }}>
                        <label class="form-check-label" for="isActive">Active</label>
                    </div>
                </div>
                {% endif %}
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a href="{{ url_for('student.list_students') }}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> {{ 'Save Changes' if student else 'Register & Continue to Face Capture' }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
