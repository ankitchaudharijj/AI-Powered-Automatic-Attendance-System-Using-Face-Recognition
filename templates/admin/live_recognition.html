{% extends "base.html" %}
{% block title %}Take Attendance{% endblock %}

{% block content %}
<div class="row g-3">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-camera-reels-fill"></i> Live Recognition</span>
                <select id="subjectSelect" class="form-select form-select-sm w-auto">
                    <option value="">General Attendance</option>
                    {% for s in subjects %}
                    <option value="{{ s.id }}">{{ s.name }} ({{ s.code }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="card-body text-center">
                <div class="webcam-frame mx-auto">
                    <video id="webcamVideo" autoplay playsinline></video>
                    <canvas id="overlayCanvas"></canvas>
                    <canvas id="captureCanvas" class="d-none"></canvas>
                </div>
                <div class="d-flex justify-content-center gap-2 mt-3">
                    <button id="startRecognitionBtn" class="btn btn-primary"><i class="bi bi-play-fill"></i> Start</button>
                    <button id="stopRecognitionBtn" class="btn btn-outline-secondary d-none"><i class="bi bi-stop-fill"></i> Stop</button>
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-4">
        <div class="card shadow-sm">
            <div class="card-header"><i class="bi bi-list-check"></i> Marked This Session</div>
            <div class="card-body p-0" style="max-height: 480px; overflow-y: auto;">
                <ul id="recognitionLog" class="list-group list-group-flush"></ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const PROCESS_FRAME_URL = "{{ url_for('face.process_frame') }}";
</script>
<script src="{{ url_for('static', filename='js/live_recognition.js') }}"></script>
{% endblock %}
