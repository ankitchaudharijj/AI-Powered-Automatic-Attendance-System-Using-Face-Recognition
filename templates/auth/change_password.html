{% extends "base.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 500px;">
    <div class="card-header"><i class="bi bi-shield-lock-fill"></i> Change Password</div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Current Password</label>
                <input type="password" name="current_password" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="form-control" required minlength="8">
                <div class="form-text">At least 8 characters, including a letter and a number.</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control" required minlength="8">
            </div>
            <div class="d-flex justify-content-between">
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Update Password</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
